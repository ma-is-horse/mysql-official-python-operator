apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    deployment.kubernetes.io/revision: "1"
  name: mgr1031-1-router
  namespace: default
  ownerReferences:
  - apiVersion: mysql.oracle.com/v2
    blockOwnerDeletion: true
    controller: true
    kind: InnoDBCluster
    name: mgr1031-1
    uid: d2cdfc9d-ef40-4599-abe7-0df08e467212
spec:
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/component: router
      app.kubernetes.io/created-by: mysql-operator
      app.kubernetes.io/instance: mysql-innodbcluster-mgr1031-1-router
      app.kubernetes.io/managed-by: mysql-operator
      app.kubernetes.io/name: mysql-router
      component: mysqlrouter
      mysql.oracle.com/cluster: mgr1031-1
      tier: mysql
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: router
        app.kubernetes.io/created-by: mysql-operator
        app.kubernetes.io/instance: mysql-innodbcluster-mgr1031-1-router
        app.kubernetes.io/managed-by: mysql-operator
        app.kubernetes.io/name: mysql-router
        component: mysqlrouter
        mysql.oracle.com/cluster: mgr1031-1
        tier: mysql
    spec:
      containers:
      - args:
        - mysqlrouter
        env:
        - name: MYSQL_HOST
          value: mgr1031-1-instances.default.svc.cluster.local
        - name: MYSQL_PORT
          value: "3306"
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              key: routerUsername
              name: mgr1031-1-router
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              key: routerPassword
              name: mgr1031-1-router
        - name: MYSQL_CREATE_ROUTER_USER
          value: "0"
        - name: MYSQL_ROUTER_BOOTSTRAP_EXTRA_OPTIONS
          value: "--conf-set-option=DEFAULT.unknown_config_option=warning"
        image: 10.6.229.80/ghcr.m.daocloud.io/ksmartdata/community-router:8.2.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /api/20190715/swagger.json
            port: http
            scheme: HTTPS
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: router
        ports:
        - containerPort: 6446
          name: mysqlrw
          protocol: TCP
        - containerPort: 6448
          name: mysqlxrw
          protocol: TCP
        - containerPort: 6450
          name: mysqlrwsplit
          protocol: TCP
        - containerPort: 6447
          name: mysqlro
          protocol: TCP
        - containerPort: 6449
          name: mysqlxro
          protocol: TCP
        - containerPort: 8443
          name: http
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - cat
            - /tmp/mysqlrouter/mysqlrouter.conf
          failureThreshold: 3
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 100Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /tmp
          name: tmpdir
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 999
        runAsGroup: 999
        runAsUser: 999
      serviceAccount: mgr1031-1-sidecar-sa
      serviceAccountName: mgr1031-1-sidecar-sa
      terminationGracePeriodSeconds: 30
      volumes:
      - emptyDir: {}
        name: tmpdir
