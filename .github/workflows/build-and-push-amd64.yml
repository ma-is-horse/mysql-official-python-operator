name: Build and Push Docker Image(AMD64)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (optional)'
        required: false
        default: ''
        type: string

env:
  DOCKER_REPO: ${{ vars.DOCKER_REPO }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tags
        id: set-tags
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tags<<EOF" >> $GITHUB_OUTPUT
            echo "${{ env.DOCKER_REPO }}:${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "tags<<EOF" >> $GITHUB_OUTPUT
            echo "${{ env.DOCKER_REPO }}:${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "${{ env.DOCKER_REPO }}:latest" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.claude
          push: true
          platforms: linux/amd64
          tags: ${{ steps.set-tags.outputs.tags }}
