          memory: 100Mi
    - image: 10.6.178.191:5000/ksmartdata/mgr-operator:8.3.0-2.1.5-1
      name: initconf
      resources:
        limits:
          cpu: "2"
          memory: 2Gi
        requests:
          cpu: 100m
          memory: 100Mi
    - image: ghcr.m.daocloud.io/ksmartdata/community-server:8.0.37
      name: initmysql
      resources:
        limits:
          cpu: "2"
          memory: 2Gi
        requests:
          cpu: 100m
          memory: 100Mi
  router:
    instances: 1
    podSpec:
      containers:
      - image: ghcr.m.daocloud.io/ksmartdata/community-router:8.2.0
        name: router
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 512Mi
  secretName: test0413-mgr-secret
  service:
    defaultPort: mysql-rw
    type: ClusterIP
  tlsUseSelfSigned: true
