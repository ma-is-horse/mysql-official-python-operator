    = TABLE #决定slave同步的位置信息记录在哪里。\nskip_log_error = OFF #如果在配置文件中设置了log_error，则此参数会导致
    MySQL 忽略 log_error 变量。\nskip_slave_start = ON #告诉复制服务器在启动时不要启动复制I/O（接收器）和SQL（应用器）线程。\nslow_query_log
    = OFF \nsocket = /var/run/mysqld/mysql.sock #MySQL服务器监听的Unix套接字文件的路径。"
  podSpec:
    affinity:
      nodeAffinity: null
      podAntiAffinity: null
    containers:
    - image: ghcr.m.daocloud.io/ksmartdata/community-server:8.0.37
