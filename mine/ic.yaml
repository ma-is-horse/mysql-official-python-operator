    - ReadWriteOnce
    resources:
      limits:
        storage: 1Gi
      requests:
        storage: 1Gi
    storageClassName: local-path
  imageRepository: ghcr.m.daocloud.io/ksmartdata
  instances: 3
  metrics:
    enable: true
    image: ""
    monitor: false
    monitorSpec: {}
  mycnf: "[mysqld]\ndatadir = /var/lib/mysql #MySQL数据文件的目录。\nenforce_gtid_consistency
    = ON #根据此变量的值，服务器通过允许仅能安全记录使用GTID的语句的执行来强制GTID一致性。\ngtid_mode = ON #控制是否启用基于GTID的日志记录以及日志可以包含哪种类型的事务。\ninnodb_log_file_size
