apiVersion: mysql.oracle.com/v2
kind: InnoDBCluster
metadata:
  name: mabing0910
spec:
  # 在podSpec里指定容器镜像
  podSpec:
    containers:
      # 本来是container-registry.oracle.com/mysql/community-server:9.4.0
      - image: release-ci.daocloud.io/demo/community-server:8.4.5
        name: mysql
        resources:
          limits:
            cpu: 4
            memory: 8Gi
          requests:
            cpu: 100m
            memory: 100Mi
      - image: release-ci.daocloud.io/demo/community-operator:8.4.6-2.1.8
        name: sidecar
        resources:
          limits:
            cpu: "4"
            memory: 8Gi
          requests:
            cpu: 1000m
            memory: 1Gi
    initContainers:
      - image: release-ci.daocloud.io/demo/community-operator:8.4.6-2.1.8
        name: fixdatadir
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 100Mi
      - image: release-ci.daocloud.io/demo/community-operator:8.4.6-2.1.8
        name: initconf
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 100Mi
      - image: release-ci.daocloud.io/demo/community-server:8.4.5
        name: initmysql
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 100Mi
  secretName: mypwds
  instances: 3
  router:
    instances: 1
  tlsUseSelfSigned: true
  datadirVolumeClaimTemplate:
    accessModes: [ "ReadWriteOnce" ]
    resources:
      requests:
        storage: 1Gi

---
apiVersion: v1
kind: Secret
metadata:
  name: mypwds
stringData:
  rootUser: root
  rootHost: '%'
  rootPassword: "root@123!"